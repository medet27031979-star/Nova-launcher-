
name: Build NOVA APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK dependencies
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q NOVA-Launcher-Android.zip -d extracted

      - name: Build APK
        run: |
          GRADLEW=$(find extracted -name gradlew -type f | head -n 1)
          test -n "$GRADLEW"
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew --no-daemon :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Launcher-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
        
