
name: Build NOVA APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          printf 'y\n%.0s' {1..20} | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q NOVA-Launcher-Android.zip -d extracted

      - name: Find Android project
        run: |
          find extracted -name gradlew -type f

      - name: Build APK
        run: |
          GRADLEW=$(find extracted -name gradlew -type f | head -n 1)
          test -n "$GRADLEW"
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew --no-daemon :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Launcher-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
