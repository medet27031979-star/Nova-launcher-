
name: Build NOVA APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          printf 'y\n%.0s' {1..20} | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q NOVA-Launcher-Android.zip -d extracted

      - name: Fix JNI version
        shell: bash
        run: |
          FILE="extracted/nova-launcher-android/app/src/main/cpp/nova_jni.cpp"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: JNI source file missing"
            exit 1
          fi

          sed -i 's/JNI_VERSION_1_8/JNI_VERSION_1_6/g' "$FILE"

          echo "Verified JNI version:"
          grep -n 'vmArgs.version' "$FILE"

      - name: Install Gradle
        shell: bash
        run: |
          PROJECT="extracted/nova-launcher-android"
          PROPERTIES="$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          GRADLE_FILE=$(grep -oE 'gradle-[0-9.]+-bin.zip' "$PROPERTIES" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle version not found"
            cat "$PROPERTIES"
            exit 1
          fi

          GRADLE_VERSION="${GRADLE_FILE#gradle-}"
          GRADLE_VERSION="${GRADLE_VERSION%-bin.zip}"

          curl -fL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o gradle.zip
          mkdir -p "$RUNNER_TEMP/gradle"
          unzip -q gradle.zip -d "$RUNNER_TEMP/gradle"

          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build NOVA APK
        run: |
          gradle --no-daemon -p extracted/nova-launcher-android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Launcher-APK
          path: extracted/nova-launcher-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
