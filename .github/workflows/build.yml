
name: Build NOVA APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          printf 'y\n%.0s' {1..20} | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q NOVA-Launcher-Android.zip -d extracted

      - name: Inspect project files
        run: |
          echo "===== ZIP CONTENTS ====="
          unzip -l NOVA-Launcher-Android.zip | head -n 120
          echo "===== EXTRACTED FILES ====="
          find extracted -maxdepth 7 -type f | head -n 150
          echo "===== GRADLE FILES ====="
          find extracted -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \)

      - name: Stop before build for inspection
        run: |
          echo "Inspection complete. Waiting to identify the actual Android project structure."
